name: CI & Test Validation

on:
  push:
    branches:
      - development
      - testing
      - main
  pull_request:
    branches:
      - development
      - testing
      - main

jobs:
  test_and_build:
    name: Code Quality, Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm install

      - name: Type Check (tsc)
        run: npm run type-check

      - name: Run Automated Test Suite (Vitest)
        run: npm test

      - name: Production Build Check (Vite)
        run: npm run build

  migration_safety_check:
    name: Database Migration Safety Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for Unsafe Destructive Statements
        run: |
          echo "Scanning supabase/migrations for unverified destructive DROP statements..."
          UNSAFE_DROPS=$(grep -rnwi "DROP TABLE" supabase/migrations/ 2>/dev/null | grep -v "IF EXISTS" || true)
          if [ -n "$UNSAFE_DROPS" ]; then
            echo "::error::Found unshielded DROP TABLE statement in migration! Use backward-compatible deprecation."
            echo "$UNSAFE_DROPS"
            exit 1
          fi
          echo "Migration safety check passed."
