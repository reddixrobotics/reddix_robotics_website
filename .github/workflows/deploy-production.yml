name: Production Deployment Gate

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  pre_deploy_checks:
    name: Pre-Deployment Automated Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm install

      - name: Run Type Check
        run: npm run type-check

      - name: Run Automated Test Suite
        run: npm test

      - name: Verify Production Build
        run: npm run build

  production_release:
    name: Production Release (Manual Approval Required)
    needs: pre_deploy_checks
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://reddixrobotics.com

    steps:
      - name: Confirm Production Gate
        run: |
          echo "Production environment gate approved."
          echo "Pre-deployment checks passed. Ready for deployment."
